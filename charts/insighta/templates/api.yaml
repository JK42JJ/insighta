apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighta.fullname" . }}-api
  labels:
    {{- include "insighta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "insighta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "insighta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # modules/scheduler/auto-sync.ts:174 waits up to 30s for in-flight
      # syncs, which is exactly the default grace period -- shutdown would be
      # SIGKILLed mid-sync, leaving sync_status=IN_PROGRESS rows that only a
      # 10-minute staleness check clears. SSE streams (mandalas.ts:3119) also
      # hold sockets open past fastify.close().
      terminationGracePeriodSeconds: 90
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: {{ toYaml .Values.api.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            # Compose reached redis over the bridge network's DNS name. In
            # the cluster that becomes the Service name, which is why redis
            # needs a Service even though nothing outside the namespace
            # talks to it.
            - name: REDIS_HOST
              value: {{ include "insighta.fullname" . }}-redis
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_USER
              value: insighta
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          lifecycle:
            preStop:
              # Give the endpoint controller time to pull this pod out of the
              # Service before the process starts refusing work.
              exec: { command: ["sh", "-c", "sleep 5"] }
          volumeMounts:
            - name: cache
              mountPath: /app/cache
            - name: logs
              mountPath: /app/logs
            # routes/admin/pool-health.ts:161 writes a snapshot here and reads
            # it back as the fallback when the live query fails; without a
            # mount it lands on the container's root filesystem.
            - name: state
              mountPath: /var/insighta
      # compose used named volumes for these. They hold regenerable data, so
      # emptyDir is correct here -- a PVC would imply the contents must
      # survive rescheduling, and they do not.
      volumes:
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighta.fullname" . }}-api
  labels:
    {{- include "insighta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      name: http
  selector:
    {{- include "insighta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
