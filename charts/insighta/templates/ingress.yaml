{{- if .Values.ingress.enabled }}
# Replaces the host nginx site config. The path list mirrors what
# sites-available/insighta.conf routes to :3000, with everything else
# falling through to the frontend -- the same order nginx applies.
#
# Not reproduced here, and why:
#   gzip           -> controller default, verified present after cutover
#   /v2/ redirect  -> a 2026-04 bookmark redirect, expired. Its only traffic in
#                     two weeks of logs was 16 scanner requests out of 18
#
# limit_req and the response headers were listed here as "controller-level
# policy" and then never configured on the controller. Naming a gap is not
# closing it: four headers and the rate limit were absent for four days.
# They now live in charts/bootstrap/ingress-nginx-config.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insighta.fullname" . }}
  labels:
    {{- include "insighta.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $hosts := include "insighta.ingressHosts" . | fromYamlArray }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range $host := $hosts }}
    - host: {{ $host }}
      http:
        paths:
          {{- range $p := list "/api" "/health" "/oauth/callback" "/documentation" "/api-reference" }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighta.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighta.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.frontend.port }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.apiRateLimit }}
---
# Rate limiting, scoped the way the host nginx scoped it.
#
#   location /api/ { limit_req zone=api burst=50 nodelay; }
#
# It was never global. Putting limit-rps on the main Ingress would also throttle
# the frontend's static assets, which a single cold page load fetches in a
# burst -- stricter than what it replaced, and a regression dressed as a fix.
#
# A second Ingress on the same host carries the annotation; the controller
# merges them and the longer path wins, so /api reaches this one and everything
# else the main rule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insighta.fullname" . }}-api-ratelimit
  labels:
    {{- include "insighta.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.apiRateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.apiRateLimit.burstMultiplier | quote }}
    {{- with .Values.ingress.apiRateLimit.whitelist }}
    nginx.ingress.kubernetes.io/limit-whitelist: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $hosts := include "insighta.ingressHosts" . | fromYamlArray }}
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range $host := $hosts }}
    - host: {{ $host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighta.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.port }}
    {{- end }}
{{- end }}
