# Production on Kubernetes.
#
# During the parallel run this deployment and the compose host are both live
# and both hold connections to the same Supabase instance. Supabase allows 60
# and the host was measured using 27 on 2026-08-14, so the cluster's budget is
# what is left, not what the end state can afford.

# Images come from ECR with the node's instance profile. The registry host is
# not committed -- it contains the AWS account id and this repository is
# public -- so it is supplied to the cluster, and a render without it fails
# with a message that says so.
requireImageRegistry: true

# Image tags, written by .github/workflows/deploy.yml after it pushes to ECR.
#
# These were `latest` in values.yaml until 2026-08-19, and `latest` cost two
# things. Rollback: both deployment revisions pointed at the same string, so
# `kubectl rollout undo` replaced pods with the same image and reported success
# while changing nothing. Consistency: with pullPolicy IfNotPresent, two nodes
# that pulled `latest` on different days run different code under one tag.
#
# A commit sha makes each deploy a distinct image string, which restores both.
# The values are managed by CI -- edit them by merging, not by hand.
#
# This first set was written by hand, because publish-tags could not write it.
# Its first execution (run 32218303510) pushed straight to main and was refused:
#
#   remote: error: GH006: Protected branch update failed for refs/heads/main.
#   remote: - 8 of 8 required status checks are expected.
#
# A direct push from CI cannot satisfy required status checks, so that job has
# to open a pull request instead. Until it does, this file is edited the way
# this commit edits it. Same for rollback.yml, which pushes by the same means
# and would fail the same way -- it has not been run since it was rewritten.
images:
  apiTag: ee9115880fe2386664344af9b45dbc3975df6bcf
  frontendTag: ee9115880fe2386664344af9b45dbc3975df6bcf
  redisTag: ee9115880fe2386664344af9b45dbc3975df6bcf

api:
  # One, not two, until the compose host is decommissioned.
  #
  #   PRISMA_POOL_LIMIT is 15 in production.
  #   2 replicas          = 30 connections
  #   + worker            ~ 10
  #   + compose host      = 27  (measured 2026-08-14)
  #                       -------
  #                         67  against a limit of 60
  #
  # Three, spread across the nodes by topologySpreadConstraints. The split is
  # not written down: three replicas over two nodes lands 2 and 1 on its own,
  # and lands 3 on one node when the second is removed -- no chart change
  # either way.
  #
  # Connection arithmetic, measured 2026-08-14 at 24 of 60 in use:
  #   3 replicas x PRISMA_POOL_LIMIT 8 = 24
  #   + worker                         ~ 8
  #   + compose host, until removed    ~15
  #                                    ----
  #                                      47 against 60
  #
  # It fits, and it stops fitting if a fourth replica is added before the
  # compose host goes.
  replicaCount: 3

  # emptyDir, not a claim. Two consequences, both deliberate:
  #
  # /app/logs  -- module logs also go to stdout since the logger change, so
  #               `kubectl logs` carries them and a reschedule loses nothing
  #               that is not already elsewhere.
  # /app/cache -- 13 MB of YouTube API responses, refetched after a reschedule
  #               at the cost of quota. This is the constraint that keeps
  #               replicaCount at 1 even after the budget allows 2: the claim
  #               is ReadWriteOnce, so moving this cache to redis is what
  #               actually unblocks horizontal scale.
  persistence:
    enabled: false

frontend:
  # Static files, no shared state, ~4 MiB resident. Nothing here consumes a
  # database connection.
  replicaCount: 3

redis:
  replicaCount: 1
  persistence:
    enabled: true
    size: 8Gi

# CI owns the schema. deploy.yml's migrate job runs `prisma db push` against
# Supabase on every deployable change, independently of where the application
# runs. A second pusher inside the chart would race it against the database
# production reads.
schemaSync:
  enabled: false

# Supabase, not an in-cluster database.
postgresDev:
  enabled: false

ingress:
  enabled: true

  # Required, and it was missing. The main Ingress carries this class only
  # because it was patched onto the live object by hand on 2026-08-14; the
  # chart never declared it. A second Ingress rendered from the same chart
  # therefore came out with no class at all and the controller refused it:
  #
  #   W ignoring ingress insighta-api-ratelimit ... does not contain a
  #     valid IngressClass
  #
  # Which mattered more than a missing rate limit: /api had just been moved to
  # that Ingress, so the path lost its rule and fell through to the frontend.
  className: nginx

  # Both names, because DNS sends both here: www is a CNAME to the apex, which
  # resolves to this cluster. The host nginx served both (server_name on the
  # :80 and :443 blocks) and its certificate covered both.
  #
  # The first Ingress declared only the apex. www then matched the controller's
  # catch-all server, which answers 404 and presents a self-signed certificate,
  # so a browser refused the connection outright. Measured 2026-08-18:
  #
  #   curl  https://www.insighta.one/   ssl_verify=20, http=000
  #   curl -k                           http=404
  #
  # Requests to an unmatched host are also invisible: the catch-all's location
  # carries access_log off, so there is no record of who tried.
  hosts:
    - insighta.one
    - www.insighta.one

  # Declared here, not patched onto the live object. It was applied by hand on
  # 2026-08-14 and survived only because server-side apply tolerates a field
  # another manager owns -- which is not a property to depend on for the thing
  # that renews the certificate.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

    # Request timeouts. The default is 60s, which is below what the scheduled
    # jobs take: trend-collector was measured at 140-181s and returns 504 while
    # the pod carries on and writes its rows. The caller records a failure for
    # work that succeeded, and the watchdog then runs it again.
    #
    # 270 sits inside a ladder that widens outward, so whichever layer cuts a
    # request is identifiable from the timeout alone:
    #
    #   external call   30s   LLM and YouTube, per call
    #   server         240s   fastify requestTimeout
    #   ingress        270s   here
    #   curl           300s   the workflow client
    #   job            600s   github actions, the last net
    #
    # Any layer expiring before the one inside it hides the real cause, which is
    # what 60s here did to four workflows configured for 300s and 900s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "270"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "270"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"

  # Scoped to /api, as the host nginx scoped it. Absent since the cutover on
  # 2026-08-14; the controller generates no limit_req rule of its own.
  apiRateLimit:
    rps: 30
    burstMultiplier: 2
  tls:
    enabled: true
    secretName: insighta-tls
