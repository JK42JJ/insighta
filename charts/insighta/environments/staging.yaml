# staging -- shaped like prod, sized to share prod's node.
#
# It runs in namespace insighta-staging on the same k3s node as prod (no extra
# cost), so three things keep it from hurting prod:
#   - podPriorityClassName insighta-staging (-200): evicted first under memory
#     pressure, and it never preempts.
#   - resourceQuota: the namespace as a whole is capped, whatever a manifest asks.
#   - small requests: under a kernel OOM the lowest request/limit ratio is
#     killed first, which is staging.
#
# Its database is a separate Supabase project (free org), so nothing written
# here reaches prod data. The env Secret leaves out every paid or outward key
# (LLM, YouTube, billing, transcripts, Slack, mail) -- see the staging runbook.
#
# Image tags are not in this file: they are in staging-images.yaml, and the
# copy staging runs is on branch deploy/staging, rebuilt by deploy.yml on every
# main merge. imageRegistry is injected when the Application is applied
# (scripts/ops/apply-staging-app.sh) because the registry host names the AWS
# account and this repository is public.
requireImageRegistry: true
podPriorityClassName: insighta-staging

resourceQuota:
  enabled: true
  # Normal running (worker at 0): requests 224Mi, limits 544Mi.
  # Worker scaled to 1 for a verification run: requests 352Mi, limits 928Mi.
  requestsMemory: 384Mi
  limitsMemory: 960Mi

api:
  replicaCount: 1
  # Replace the pod instead of overlapping two: the namespace quota admits one
  # api pod's requests, not two. staging may go down for a few seconds on a
  # deploy; prod may not, and does not use this.
  strategyType: Recreate
  # Single replica, so a ReadWriteOnce claim is valid and the YouTube
  # response cache survives a restart instead of spending quota to rebuild.
  persistence:
    enabled: true
  resources:
    requests:
      memory: 192Mi      # prod api measured 188-190 MiB on 2026-10-29
      cpu: 50m
    limits:
      memory: 384Mi
      cpu: 500m

# Enabled so the api pods run HTTP only (RUN_SCHEDULERS=false): no cron fires
# in staging unless the worker is scaled up for a verification run.
worker:
  enabled: true
  # Drains the queue: a card opened by a user enqueues its summary, and without a
  # worker that job stays "created" for ever. Schedulers stay off so that nothing
  # runs on a timer unattended; the creation-time summary chain is stopped by
  # V2_AUTO_ENRICH_ENABLED=false in the staging Secret (build-stg-secret.py).
  # 0 while users judge cards on the phone: the morning feed reads and writes the database only
  # (no queue), and the node has ~400 MB free. Card summaries and add-cards queue until this is 1 again.
  replicaCount: 0
  runSchedulers: false
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 384Mi
      cpu: 500m

curation:
  weeklyEnabled: false

# Mobile morning cards (PRD #1788): staging only. prod values stay unset (= off).
morningCards:
  enabled: true
  # Comma-separated staging test account user ids (jamesjk4242, jkim0420, stg-tester).
  testUserIds: "bdf3c0ae-33f5-43d5-b8a8-2cf824e6625c,7285aac0-9011-4475-8081-64b74f1c0fff,0cd661ef-fd9d-4e87-89fe-65758ef4fc02"
  # Virtual "today" for repeat tests (2026-11-14): jamesjk4242 and the scenario-test account
  # (jkim0420, STG_JAMES_*). Not set in prod.
  virtualDayUserIds: "bdf3c0ae-33f5-43d5-b8a8-2cf824e6625c,7285aac0-9011-4475-8081-64b74f1c0fff"
  # Shared brief (2026-11-14): every signed-in user reads this account's morning_pages rows.
  briefOwnerId: "bdf3c0ae-33f5-43d5-b8a8-2cf824e6625c"
  # Accounts that keep the experiment UI (video batches, viewing order). Needs the test list too.
  experimentUserIds: "bdf3c0ae-33f5-43d5-b8a8-2cf824e6625c"

keel:
  enabled: false

frontend:
  replicaCount: 1
  # Replace the pod instead of overlapping two. The namespace quota (limits.memory)
  # had no room for the surge pod, so the 2026-11-07 frontend rollout never
  # started and staging kept serving the 2026-10-29 bundle. Same reason as api.
  strategyType: Recreate
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 200m

redis:
  replicaCount: 1
  maxmemory: 64mb
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 96Mi
      cpu: 200m

# Schema reaches staging from deploy.yml, the same path prod uses. The in-cluster
# hook runs `prisma db push`, which fails on Supabase's auth-owned tables.
schemaSync:
  enabled: false

ingress:
  enabled: true
  # Without a class the controller refuses the object outright -- it does not
  # fall back to a default. prod hit exactly that on 2026-08-18.
  className: nginx
  host: stg.insighta.one
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: true
    secretName: insighta-staging-tls
