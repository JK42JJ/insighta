# staging -- shaped like prod but single-replica. Its job is to catch what
# breaks on promotion, not to survive a node loss.
api:
  replicaCount: 1
  # Single replica, so a ReadWriteOnce claim is valid and the YouTube
  # response cache survives a restart instead of spending quota to rebuild.
  persistence:
    enabled: true
frontend:
  replicaCount: 1
redis:
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi

ingress:
  enabled: true
  # Without a class the controller refuses the object outright -- it does not
  # fall back to a default. prod hit exactly that on 2026-08-18.
  className: nginx
  host: staging.insighta.one
  tls:
    enabled: true
    secretName: insighta-staging-tls
