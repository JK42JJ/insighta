# Configuration for the ingress controller.
#
# The controller was installed by applying its upstream manifest, which leaves
# this ConfigMap with no data section at all -- every setting at its default.
# Anything tuned with `kubectl edit` would disappear the next time that manifest
# is applied, so the settings live here instead.
#
# Nothing syncs this automatically yet: charts/bootstrap is what root-app would
# watch, and root-app has not been applied. Until it is, this file is applied by
# hand and its value is that the applied state is reconstructible from git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/component: controller
data:
  # ── D-2 ───────────────────────────────────────────────────────────────────
  # The default format carries no $host, so a request to www.insighta.one and
  # one to insighta.one are indistinguishable in the log. That gap made a
  # question unanswerable on 2026-08-18: after finding www unreachable, there
  # was no way to tell whether anyone had tried to reach it. The old host's log
  # was `combined` and had the same gap, so neither side could answer it.
  #
  # host= is appended rather than inserted, so anything parsing the existing
  # fields by position keeps working.
  log-format-upstream: >-
    $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent
    "$http_referer" "$http_user_agent" $request_length $request_time
    [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr
    $upstream_response_length $upstream_response_time $upstream_status $req_id
    host=$host

  # ── D-3 · HSTS ────────────────────────────────────────────────────────────
  # The controller sends HSTS by default, but weaker than the host nginx did:
  #
  #   host nginx   max-age=63072000; includeSubDomains; preload
  #   controller   max-age=31536000; includeSubDomains
  #
  # preload is restored deliberately. The domain carried that header for a long
  # time and may already be on the browser preload list; dropping it there and
  # leaving it dropped is the change that would matter, not restoring it.
  hsts: "true"
  hsts-max-age: "63072000"
  hsts-include-subdomains: "true"
  hsts-preload: "true"

  # The other four headers come from a separate ConfigMap. add-headers is the
  # supported mechanism; configuration-snippet is disabled by default in recent
  # controllers and would fail silently.
  add-headers: ingress-nginx/custom-response-headers
---
# The four headers the host nginx set at server level -- so on every response,
# which is why they are global here rather than per-Ingress.
#
# Measured absent on 2026-08-18, four days after the cutover: the old box
# returned five security headers to the same request, the cluster returned one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-response-headers
  namespace: ingress-nginx
data:
  X-Content-Type-Options: nosniff
  X-Frame-Options: SAMEORIGIN
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: strict-origin-when-cross-origin
