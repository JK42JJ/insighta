# One Application per environment, all sourced from the same chart.
#
# syncPolicy is empty on purpose. Design P3: ArgoCD reports the difference
# first, a human reads it, and automated sync is enabled only once the app
# stays InSync without help.
#
# There is no prod Application yet. Production still runs as docker compose
# on EC2, so a prod Application would report every resource Missing --
# noise, not information. It is added at P4, with the cutover.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: insighta-dev
  namespace: argocd
spec:
  project: insighta-dev
  source:
    repoURL: https://github.com/JK42JJ/insighta
    targetRevision: main
    path: charts/insighta
    helm:
      releaseName: insighta
      valueFiles:
        - environments/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: insighta-dev
  syncPolicy: {}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: insighta-staging
  namespace: argocd
spec:
  project: insighta-staging
  source:
    repoURL: https://github.com/JK42JJ/insighta
    targetRevision: main
    path: charts/insighta
    helm:
      releaseName: insighta
      valueFiles:
        - environments/staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: insighta-staging
  syncPolicy: {}
---
# The AWS validation node. Deployed by hand first, then handed to Argo so the
# handover itself is the thing being tested: whether a release created by the
# helm CLI can be adopted without recreating it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: insighta-validation
  namespace: argocd
spec:
  project: insighta-validation
  source:
    repoURL: https://github.com/JK42JJ/insighta
    targetRevision: main
    path: charts/insighta
    helm:
      releaseName: insighta
      valueFiles:
        - environments/validation.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: insighta
  # ServerSideApply and a StatefulSet with volumeClaimTemplates leave this
  # application permanently OutOfSync. `argocd app diff` reports nothing and
  # the rendered manifest is a subset of the live object, so there is no
  # content difference; the API server's own defaulting of the claim templates
  # is what the controller keeps seeing. Established by A/B on 2026-08-14:
  #
  #   ServerSideApply removed   -> Synced
  #   ServerSideApply restored  -> OutOfSync
  #   ...reproduced both ways.
  #
  # Dropping ServerSideApply would fix it and give up the field-pruning this
  # deployment needs. Ignoring the claim templates keeps both: they are
  # immutable after creation, so nothing is being masked that could later be
  # changed through this path.
  #
  # A permanently OutOfSync application is worse than either problem it would
  # report -- it teaches everyone to stop reading the status.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates

  syncPolicy:
    # Automated here and nowhere else. This cluster serves no traffic and
    # exists to answer "does main deploy", which a manual sync postpones.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # A release created by the helm CLI and then handed to Argo keeps fields
      # the chart no longer renders: the last-applied-configuration belongs to
      # helm, so a client-side apply has nothing to prune against. Measured
      # 2026-08-14 -- imagePullSecrets: [ghcr] survived a Synced report after
      # the chart stopped rendering it, and the pods referenced a secret that
      # did not exist.
      #
      # Server-side apply fixes this going forward. It does not retroactively
      # take fields owned by another manager, so an adopted release needs those
      # removed once, by hand, at adoption time.
      - ServerSideApply=true
      # Without this, ignoreDifferences affects the displayed diff but not what
      # a sync applies, and the application returns to OutOfSync immediately.
      - RespectIgnoreDifferences=true
