# ai-tech — 이 브리프가 이름 붙이는 개념들
#
# 왜 파일인가
#
#   S5 의 첫 버전은 별칭 배열 24줄이었다. `agent` 가 274편 중 144개 채널에
#   걸렸고, 그래서 모든 영상이 같은 점수를 받아 순위 신호가 죽었다. 원인은
#   임계값이 아니라 층위였다 — `agent` 와 `prompt-injection` 을 같은 평면에서
#   센 것이다. 위계가 있으면 잎에서 세고 가지에서 요약할 수 있다.
#
#   온톨로지를 빌려 쓰려 했으나 불가능했다. 그래프의 concept 25,337개는 한
#   독자의 것이고 내용은 캠핑·인테리어·자동차다. 브리프는 자기 어휘를 가져야
#   하고, 그 어휘는 사람이 검토하는 파일이어야 한다. 신뢰 채널 목록과 같은
#   위상이다.
#
# 규율
#
#   - 개념은 사람이 추가한다. 기계가 만들지 않는다.
#   - broader 는 한 단계만. 깊은 나무는 유지되지 않는다.
#   - aliases 는 매칭 보조일 뿐 정의가 아니다. 한국어 표기를 반드시 포함한다.
#   - 개념을 지우지 않는다. 쓰지 않게 되면 active: false. 지난 호가 인용한
#     개념이 사라지면 그 호의 근거가 사라진다.
#
# 스키마
#   key       그래프 노드의 title. 안정적이어야 하며 바꾸지 않는다.
#   label     지면에 쓰는 한국어 이름.
#   broader   상위 개념의 key. 최상위는 생략.
#   aliases   제목·설명문에서 이 개념을 가리키는 표기들.
#   active    기본 true.

version: 1
category: ai-tech

