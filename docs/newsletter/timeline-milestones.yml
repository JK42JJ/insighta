# AI 엔지니어링 타임라인 — 이정표
#
# 이 파일이 타임라인의 사실 원천입니다. 우리 수집량에서 유추하지 않습니다.
#
# 한 번 시도했다가 폐기한 방식: `video_pool` 의 월별 키워드 점유율을 추세로
# 그리는 것. 실패한 이유는 그 테이블이 AI 엔지니어링을 위해 모인 것이 아니어서,
# 프롬프트 인젝션 영상이 13개월간 0편으로 나오기 때문입니다. 이번 주에만 41편을
# 찾은 것은 뉴스레터 파이프라인이 전용 쿼리로 따로 수확했기 때문이고, 그 둘을
# 한 축에 그리면 "1년간 없다가 갑자기 생겼다" 는 거짓 곡선이 됩니다.
#
# 그래서 이정표는 리서치된 사실이고, 각 항목에 1차 출처 URL 이 필수입니다.
# URL 이 없는 항목은 타임라인에 들어가지 않습니다.
#
# 필드
#   date     YYYY-MM-DD. 발표일 기준. 유출·소문은 넣지 않습니다.
#   title    한 줄. 무엇이 일어났는가.
#   track    model | agent | security | infra | policy  (타임라인의 가로 레인)
#   weight   1~3. 3 = 업계가 방향을 바꾼 사건, 1 = 기록용.
#   source   1차 출처 URL. 벤더 공지 · 논문 · CVE · 공식 블로그.
#            언론 보도는 1차 출처가 없을 때만, 그리고 그렇게 표시합니다.
#   note     선택. 왜 중요한지 한 문장.
#
# 갱신
#   매 호 발행 시 그 주의 사건을 여기에 추가합니다. 타임라인은 이 파일에서
#   생성되므로, 파일이 자라면 그래프도 자랍니다.

milestones: []
  # 예시 — 실제 항목은 리서치 후 채웁니다.
  # - date: 2026-08-27
  #   title: ""
  #   track: security
  #   weight: 3
  #   source: "https://..."
  #   note: ""
