name: Staging data clean

# Ends a verification cycle on staging: empties what the tests produced, keeps the
# data staging needs (scripts/ops/stg-keep-tables.txt), then refreshes the
# reference rows from prod (scripts/ops/stg-reference-tables.txt).
#
# Run it after a promotion reached prod, or when a staging run is abandoned.
# It only ever writes to the staging Supabase project; prod is read, never written.
# The structure is not touched -- rebuild-stg-db.sh is the repair tool for that.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: stg-db
  cancel-in-progress: false

jobs:
  clean:
    name: Clean staging data
    # Same switch the other staging jobs use: absent until staging exists.
    if: ${{ vars.STG_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Empty the data the tests produced
        run: bash scripts/ops/clean-stg-data.sh
        env:
          STG_DIRECT_URL: ${{ secrets.STG_DIRECT_URL }}
          STG_PROJECT_REF: ${{ vars.STG_PROJECT_REF }}

      # After the clean, so nothing references the rows being replaced.
      - name: Refresh the reference rows from prod (read-only)
        run: bash scripts/ops/sync-stg-reference.sh
        env:
          STG_DIRECT_URL: ${{ secrets.STG_DIRECT_URL }}
          STG_PROJECT_REF: ${{ vars.STG_PROJECT_REF }}
          PROD_DIRECT_URL: ${{ secrets.DIRECT_URL }}
