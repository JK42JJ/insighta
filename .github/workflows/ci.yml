name: CI

on:
  # Feature-branch push used to fire here (branches-ignore: [main]), which
  # caused every PR to see two CI runs: one from the push event and one
  # from the subsequent pull_request event. The concurrency group below
  # does not dedupe them because push and pull_request produce different
  # github.ref values. PR coverage via pull_request already validates
  # feature branches, and deploy.yml re-invokes this workflow via
  # `workflow_call` on main merge, so the push trigger was redundant.
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: D&D Change Guard
        if: github.event_name == 'pull_request'
        run: |
          DND_FILES=$(git diff origin/main --name-only | grep -E "(useCardDragDrop|useDragSelect|DraggableCard|SortableContext|DndContext|useDroppable|useSortable|SidebarHeatMinimap|collisionDetection|FloatingScratchPad|MandalaCell)" || true)
          if [ -n "$DND_FILES" ]; then
            echo "::warning::D&D CRITICAL FILES CHANGED — verify regression manually"
            echo "$DND_FILES"
            echo ""
            echo "Required: run dnd-smoke.spec.ts locally + browser manual verification"
            echo "History: D&D regression 3x (CP248, CP268, CP271)"
          fi

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean install (resolves platform-specific native binaries)
        run: cd frontend && rm -rf node_modules package-lock.json && npm install --no-audit --legacy-peer-deps
      - run: cd frontend && npx vitest run

  # The Kubernetes manifests had no CI coverage at all while TypeScript had
  # eight jobs. Measured cost on 2026-08-14: a `redis.enabled` guard added
  # without its default removed the redis Service and StatefulSet from dev,
  # staging and prod simultaneously, and `helm lint` passed.
  chart-verify:
    name: Chart Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/
      - name: helm lint
        run: |
          for e in dev staging prod validation; do
            helm lint charts/insighta -f charts/insighta/environments/$e.yaml
          done
      - name: Render and check every environment
        run: bash scripts/ci/check-charts.sh

      # A request crosses several layers and each has its own timeout. When they
      # do not know about each other the shortest one decides everything: the
      # ingress sat at its 60s default from 2026-08-14 while the workflows
      # calling it allowed 300s, so long jobs were cut by a number declared
      # nowhere and the logs showed a bare 504.
      - name: Check the timeout ladder
        run: bash scripts/ci/check-timeouts.sh

  hardcode-audit:
    name: Hardcode Audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npx tsx scripts/audit/hardcode-audit.ts
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardcode-audit-report
          path: reports/hardcode-audit/latest.json
          retention-days: 30

  config-ssot:
    name: Config SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Toggle single-source-of-truth guard
        # INV-CONFIG-SSOT — fails on (a) a toggle in both compose environment:
        # and deploy.yml .env-write, or (b) a duplicate key within compose
        # environment: (silent-override class, §10-C). See the script header.
        run: bash scripts/ci/check-config-ssot.sh

  card-chokepoint:
    name: Card Chokepoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: auto_added card-placement chokepoint guard
        # INV-CHOKEPOINT-ENFORCED — auto_added:true (discovery inflow) may be
        # inserted only via placeAutoAddedCards; flags any new bypass path.
        run: bash scripts/ci/check-card-chokepoint.sh

  # Combined: test-backend + build-api (saves 1 npm ci)
  test-and-build-api:
    name: Test Backend & Build API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx jest --testPathPattern=tests/smoke
        env:
          # billing smoke tests import webhook-handler / system-settings,
          # which pull in config/index.ts zod validation (ENCRYPTION_SECRET
          # is the only no-default required var). Other smoke tests don't
          # hit this chain, so the var wasn't needed here before.
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
      - run: npm run build

  # Combined: build-frontend + a11y (saves 1 npm install + 1 vite build)
  build-and-a11y-frontend:
    name: Build Frontend & Accessibility
    runs-on: ubuntu-latest
    needs: [test-frontend]
    # No job in this file had a timeout until 2026-08-19, so a step that hangs
    # runs to GitHub's 6-hour default. On that day the browser install below
    # stopped returning and three pull requests sat blocked for five hours on a
    # required check that was neither passing nor failing -- the worst of the
    # three states, because nothing reports and nothing retries.
    #
    # This job's successful runs that day took 2 to 5 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && rm -rf node_modules package-lock.json && npm install --no-audit --legacy-peer-deps
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
        env:
          VITE_API_URL: /api
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
      # `--with-deps` shells out to apt-get, which is what hung on 2026-08-19:
      # every run after 05:06Z stopped at this step and none before it did.
      # The ubuntu-latest image already carries chromium's shared libraries, so
      # the browser download alone is enough here and removes the apt step from
      # the critical path entirely.
      #
      # Kept separately timed out from the job: if this is slow again, the
      # failure should name this step rather than the whole job.
      - name: Install the chromium build playwright expects
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: cd frontend && npx playwright install chromium
      - name: Run axe accessibility tests
        run: cd frontend && npx playwright test tests/a11y.spec.ts --project=no-auth
