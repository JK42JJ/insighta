name: Keel

# Invariant checks, on a schedule.
#
# These watch the failure mode this service actually has: something is wrong
# and nothing died. Drift between the chart and the running image went eight
# days unnoticed; the Mac Mini transcript service was down for forty-four; a
# day cost $36.18 across calls that all succeeded. Not one of those moves a
# CPU graph, which is why the first monitoring here is not a dashboard.
#
# Two places since 2026-10-02. The "is it working right now" checks run every
# fifteen minutes inside the cluster (CronJob keel, src/modules/keel). This
# workflow runs once a day: the checks that need a repository checkout or AWS
# credentials, plus cluster-keel, which fails once if the cluster saw something
# get worse in the last day or stopped reporting. That is how the cluster's
# findings reach a person while no Slack webhook exists -- at most one failure
# mail a day, instead of one per red run on a schedule GitHub delayed to one to
# five hours.

on:
  schedule:
    # Daily checks, 09:20 KST. After the digest so the two do not queue
    # behind each other on the concurrency group.
    - cron: '20 0 * * *'
    # Daily spend digest, 09:00 KST.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      digest:
        description: 'Also send the spend digest'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # A run that overlaps its predecessor would write two ledger rows for the
  # same state and could alert twice on one transition.
  group: keel
  cancel-in-progress: false

jobs:
  checks:
    name: Invariant checks
    # The digest cron does its own thing below; this job is for every other
    # trigger.
    if: github.event.schedule != '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift check reads when the chart file last moved, to tell a
          # deploy in progress from a deploy that stalled. A shallow clone has
          # no such history and the check degrades to alerting immediately.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Run checks
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
          AWS_DEFAULT_REGION: us-west-2
        run: npx tsx scripts/keel/run.ts

  digest:
    name: Spend digest
    if: github.event.schedule == '0 0 * * *' || inputs.digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Send the digest
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: npx tsx scripts/keel/spend-digest.ts
