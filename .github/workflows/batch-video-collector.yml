name: batch-video-collector

# Daily trigger for the video_pool cache collector (Source A: trend
# keywords). The workflow just POSTs to the internal skill endpoint on
# prod; all heavy lifting runs inside the API container.
#
# Trigger: 07:30 UTC (= 00:30 PT PDT = 16:30 KST) daily — just after
# the YouTube Data API quota resets at 00:00 Pacific Time. Previous
# schedule (04:00 UTC) ran during the last 3 hours before reset; at
# that point user-facing v3 discover traffic had usually drained the
# shared `YOUTUBE_API_KEY_SEARCH` quota, so batch ran with 0-200 units
# remaining and either failed immediately or partial-exhausted mid-run
# (`videos_new=0` in 6 of 7 prior runs — see video_pool_collection_runs
# diagnostic in CP417 /retro).
#
# Manual: `gh workflow run batch-video-collector.yml`.
#
# Secrets required:
#   - INTERNAL_BATCH_TOKEN  — shared token matching the value in
#                             prod `/opt/tubearchive/.env`.
#   - DOMAIN                — already used by Deploy (e.g. insighta.one).

on:
  schedule:
    # 2026-08-11 [P5] — back to 1×/day for the restart.
    #
    # CP489 had taken this to 2×/day (07:30 + 19:30 UTC) chasing a 30k-active
    # pool. The workflow was then disabled 2026-06-06 for burning ~40k units/day
    # with no consumer, and stayed disabled through 06-04 → 08-11 while curation
    # quietly became that consumer. Restarting straight back at 2×/day would
    # spend the same 40k before anyone has looked at a single pass rate, so the
    # second run is removed until a day of numbers exists. 07:30 UTC (16:30 KST)
    # is right after the YouTube quota reset at 00:00 PT, which is why the run
    # sits there: the earlier 04:00 UTC slot competed with user-facing discover
    # traffic for the shared search key and returned videos_new=0 in 6 of 7 runs
    # (CP417 /retro).
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      limit:
        # Advisory only. The queue handler forwards this on the payload but the
        # executor reads BATCH_COLLECTOR_LIMIT from its frozen env snapshot, so
        # the real size lives in docker-compose.prod.yml. Kept for forensics.
        description: 'Advisory — real limit is BATCH_COLLECTOR_LIMIT in compose.'
        required: false
        type: string
      runType:
        description: 'Run type (default daily_trend).'
        required: false
        default: 'daily_trend'
        type: string

jobs:
  trigger:
    name: Trigger collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.INTERNAL_BATCH_TOKEN }}" ]; then
            echo "::error::INTERNAL_BATCH_TOKEN is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.DOMAIN }}" ]; then
            echo "::error::DOMAIN is not configured"
            exit 1
          fi

      - name: Run trend-collector (populates trend_signals)
        env:
          TOKEN: ${{ secrets.INTERNAL_BATCH_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "POST → https://${DOMAIN}/api/v1/internal/skills/trend-collector/run"
          TREND_RESPONSE=$(curl -sS --fail --show-error \
            --max-time 300 \
            -X POST "https://${DOMAIN}/api/v1/internal/skills/trend-collector/run" \
            -H "content-type: application/json" \
            -H "x-internal-token: $TOKEN" \
            -d '{}')
          echo "Trend response: $TREND_RESPONSE"
          echo "$TREND_RESPONSE" | jq -e '.success == true' >/dev/null || {
            echo "::warning::trend-collector returned success=false — batch may fail"
            echo "$TREND_RESPONSE"
          }

      - name: Invoke batch-video-collector
        env:
          TOKEN: ${{ secrets.INTERNAL_BATCH_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}
          LIMIT: ${{ github.event.inputs.limit }}
          RUN_TYPE: ${{ github.event.inputs.runType }}
        run: |
          BODY="{}"
          if [ -n "$LIMIT" ] || [ -n "$RUN_TYPE" ]; then
            BODY=$(jq -nc --arg l "$LIMIT" --arg r "$RUN_TYPE" '{limit: ($l | tonumber? // null), runType: ($r // null)} | with_entries(select(.value != null))')
          fi
          echo "POST → https://${DOMAIN}/api/v1/internal/skills/batch-video-collector/run"
          echo "Body: $BODY"
          RESPONSE=$(curl -sS --fail --show-error \
            --max-time 900 \
            -X POST "https://${DOMAIN}/api/v1/internal/skills/batch-video-collector/run" \
            -H "content-type: application/json" \
            -H "x-internal-token: $TOKEN" \
            -d "$BODY")
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.success == true' >/dev/null || {
            echo "::error::Collector returned success=false"
            echo "$RESPONSE"
            exit 1
          }
