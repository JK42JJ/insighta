name: E2E (staging)

# Post-deploy integrity tests: a real browser signs in to https://stg.insighta.one
# with the staging test account and checks that the deployed bundle, the staging
# API and the staging Supabase project work together (frontend/tests/stg).
#
# Called by deploy.yml after the staging smoke check, and runnable by hand.
# A red run here is the signal not to promote; it never touches prod.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e-staging:
    name: Playwright E2E (staging)
    # Same switch the other staging jobs use: absent until staging exists.
    if: ${{ vars.STG_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run staging integrity tests
        run: cd frontend && npx playwright test -c playwright.stg.config.ts
        env:
          CI: true
          BASE_URL: https://stg.insighta.one
          STG_PROJECT_REF: ${{ vars.STG_PROJECT_REF }}
          STG_TEST_EMAIL: ${{ secrets.STG_TEST_EMAIL }}
          STG_TEST_PASSWORD: ${{ secrets.STG_TEST_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: frontend/test-results/stg-report/
          retention-days: 7
