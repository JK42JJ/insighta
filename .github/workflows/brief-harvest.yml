name: Brief harvest

# The material half of the weekly brief, and only that half.
#
# S0 gathers, S1 drops what is not watchable, S2 applies the topic boundary
# and decides what is worth a person's judgement. The schedule stops there:
# the console judge is a person reading candidates, and the model judge spends
# money on a schedule, which is the shape of spend this project has switched
# off before.
#
# A dispatch can go further. Once the verdicts are written and committed, the
# same workflow continues the run that harvested -- `from_stage: S3_judge`
# with that run's id -- so the funnel stays in one ledger rather than starting
# a second that would disagree with the first.
#
# Until this existed the pipeline had run once, by hand, on 2026-09-02, and the
# second issue had no path to being started.

on:
  schedule:
    # Sunday 20:00 UTC = Monday 05:00 KST. The ISO week the brief is dated by
    # has just closed, so the 7-day harvest window covers exactly that week.
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      to_stage:
        description: 'Last stage to run'
        required: false
        default: 'S2_domain'
        type: choice
        options:
          - S0_harvest
          - S1_format
          - S2_domain
          - S3_judge
          - S4_deep
          - S5_cross
          - S6_stats
          - S7_draft
          # S8_evidence is deliberately not offered here. It reads captions,
          # and a GitHub runner reaches neither transcript proxy -- one is on a
          # Tailscale address, the other on a private host (the same fact that
          # makes Keel ask the pod for /health/dependencies instead of probing
          # them itself). Selected here it would run, find no captions for
          # every video, and write a ledger row saying so, which is a worse
          # answer than not offering it. It runs where the captions are.
      from_stage:
        description: 'First stage to run. Use S3_judge to continue an existing run.'
        required: false
        default: 'S0_harvest'
        type: choice
        options:
          - S0_harvest
          - S1_format
          - S2_domain
          - S3_judge
      run_id:
        description: 'Existing run to continue. Required when from_stage is not S0_harvest.'
        required: false
        type: string
      verdicts:
        description: 'Path to the verdict file S3 reads. Required to reach S3 or beyond.'
        required: false
        default: ''
        type: string

concurrency:
  # Two harvests of the same week would both write corpus rows for one run and
  # make the funnel disagree with itself, which S6 is built to stop rather than
  # to survive.
  group: brief-harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: Gather this week's material
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # A run that reaches S3 continues one that already harvested, so the
      # verdicts can be written against candidates that exist. Passing --run
      # keeps the funnel in one ledger rather than starting a second that
      # would disagree with the first.
      - name: Run ${{ inputs.from_stage || 'S0_harvest' }} to ${{ inputs.to_stage || 'S2_domain' }}
        run: |
          set -eu
          ARGS="--from ${FROM_STAGE} --to ${TO_STAGE}"
          if [ -n "${RUN_ID}" ]; then ARGS="$ARGS --run ${RUN_ID}"; fi
          if [ -n "${VERDICTS}" ]; then
            test -f "${VERDICTS}" || { echo "::error::verdict file not found: ${VERDICTS}"; exit 1; }
            ARGS="$ARGS --verdicts ${VERDICTS}"
          fi
          npx tsx scripts/newsletter/run-pipeline.ts $ARGS \
            --out "docs/newsletter/draft-$(date -u +%Y-%m-%d).json"
        env:
          FROM_STAGE: ${{ inputs.from_stage || 'S0_harvest' }}
          TO_STAGE: ${{ inputs.to_stage || 'S2_domain' }}
          RUN_ID: ${{ inputs.run_id || '' }}
          VERDICTS: ${{ inputs.verdicts || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_SEARCH: ${{ secrets.YOUTUBE_API_KEY_SEARCH }}
          YOUTUBE_API_KEY_SEARCH_2: ${{ secrets.YOUTUBE_API_KEY_SEARCH_2 }}
          YOUTUBE_API_KEY_SEARCH_3: ${{ secrets.YOUTUBE_API_KEY_SEARCH_3 }}
          YOUTUBE_API_KEY_SEARCH_4: ${{ secrets.YOUTUBE_API_KEY_SEARCH_4 }}
          YOUTUBE_API_KEY_SEARCH_5: ${{ secrets.YOUTUBE_API_KEY_SEARCH_5 }}
          YOUTUBE_API_KEY_SEARCH_6: ${{ secrets.YOUTUBE_API_KEY_SEARCH_6 }}
          YOUTUBE_API_KEY_SEARCH_7: ${{ secrets.YOUTUBE_API_KEY_SEARCH_7 }}
          YOUTUBE_API_KEY_SEARCH_8: ${{ secrets.YOUTUBE_API_KEY_SEARCH_8 }}
          YOUTUBE_API_KEY_VIDEOS: ${{ secrets.YOUTUBE_API_KEY_VIDEOS }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}

      # The run writes its counts to newsletter_pipeline_steps, which is the
      # record. This file is the convenience copy for whoever reads the result
      # without a database client.
      - name: Keep the run's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-material
          path: docs/newsletter/draft-*.json
          if-no-files-found: ignore
          retention-days: 30
