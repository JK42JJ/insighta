name: Deploy

# Display name on the Actions tab + `gh run list`. push triggers show the
# commit message (default GH behaviour); manual `workflow_dispatch` runs
# would otherwise display only "Deploy" — the `reason` input + this
# expression label them like "Deploy (manual: rotate QWEN_LORA secret)".
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Deploy (manual: {0})', inputs.reason || 'no reason given')
      || format('Deploy {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually? (shown in run-name)'
        type: string
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/jk42jj/insighta-api
  FRONTEND_IMAGE: ghcr.io/jk42jj/insighta-frontend

jobs:
  # What actually changed. The dial is a single static file that nginx serves
  # verbatim (vite copies public/ without touching it), so a dial-only commit
  # needs no image build and no test suite -- it needs one file copied. Before
  # this job every such commit paid the full 14-22 minute pipeline for a 322KB
  # file, and the EC2 step inside that was 1m26s.
  scope:
    name: Detect scope
    runs-on: ubuntu-latest
    outputs:
      mobile_only: ${{ steps.d.outputs.mobile_only }}
      dial: ${{ steps.d.outputs.dial }}
      api: ${{ steps.d.outputs.api }}
      frontend: ${{ steps.d.outputs.frontend }}
      redis: ${{ steps.d.outputs.redis }}
      deployable: ${{ steps.d.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          # workflow_dispatch has no diff to inspect -- treat it as "everything".
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "mobile_only=false" >> "$GITHUB_OUTPUT"
            echo "dial=true"         >> "$GITHUB_OUTPUT"
            echo "api=true"          >> "$GITHUB_OUTPUT"
            echo "frontend=true"     >> "$GITHUB_OUTPUT"
            echo "redis=true"        >> "$GITHUB_OUTPUT"
            echo "deployable=true"   >> "$GITHUB_OUTPUT"
            echo "manual run -> full pipeline"; exit 0
          fi

          BEFORE='${{ github.event.before }}'
          # First push to a branch, or a force-push whose base we no longer
          # have, reports an all-zero SHA. Fall back to the full pipeline
          # rather than guessing a range.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "mobile_only=false" >> "$GITHUB_OUTPUT"
            echo "dial=true"         >> "$GITHUB_OUTPUT"
            echo "api=true"          >> "$GITHUB_OUTPUT"
            echo "frontend=true"     >> "$GITHUB_OUTPUT"
            echo "redis=true"        >> "$GITHUB_OUTPUT"
            echo "deployable=true"   >> "$GITHUB_OUTPUT"
            echo "no usable base ($BEFORE) -> full pipeline"; exit 0
          fi

          FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "changed:"; echo "$FILES" | sed 's/^/  /'

          # An empty diff (re-run, merge with no changes) is not a licence to
          # skip -- fall through to the full pipeline.
          if [ -z "$FILES" ]; then
            echo "mobile_only=false" >> "$GITHUB_OUTPUT"
            echo "dial=true"         >> "$GITHUB_OUTPUT"
            echo "api=true"          >> "$GITHUB_OUTPUT"
            echo "frontend=true"     >> "$GITHUB_OUTPUT"
            echo "redis=true"        >> "$GITHUB_OUTPUT"
            echo "deployable=true"   >> "$GITHUB_OUTPUT"
            echo "empty diff -> full pipeline"; exit 0
          fi

          if echo "$FILES" | grep -qv '^frontend/public/mobile/'; then
            MOBILE_ONLY=false
          else
            MOBILE_ONLY=true
          fi

          # Whether the dial changed at all, which is not the same question as
          # whether it changed alone. The syntax gate hung off mobile_only, so a
          # commit touching the dial and anything else skipped the only check
          # the dial has.
          if echo "$FILES" | grep -q '^frontend/public/mobile/'; then DIAL=true; else DIAL=false; fi

          # Which image actually needs rebuilding. The API image is built from
          # the repo root, so anything outside frontend/ can affect it.
          if echo "$FILES" | grep -qv '^frontend/'; then API=true; else API=false; fi
          if echo "$FILES" | grep -q  '^frontend/';  then FE=true;  else FE=false;  fi
          # The redis image is a Dockerfile plus three files. Rebuilding it on
          # every backend commit is 20 wasted seconds; rebuilding it never is
          # how the cluster ended up with no redis image at all.
          if echo "$FILES" | grep -q  '^docker/redis/'; then RD=true; else RD=false; fi

          # Does anything here reach production at all?
          #
          # Every path below is excluded from the API image by .dockerignore, so
          # a change confined to them cannot alter what the image contains.
          #
          # charts/ is in this list and has to stay there. publish-tags writes the
          # commit sha into charts/insighta/environments/prod.yaml and pushes to
          # main, and that push has to come back here as deployable=false or it
          # starts a loop. Checked against that exact path on 2026-08-19.
          #
          # Written as an exclusion rather than an allowlist on purpose. A new
          # top-level directory nobody thought about falls through to
          # deployable=true, which wastes a deploy; an allowlist would silently
          # skip it, and a deploy that should have happened and did not is the
          # failure this repository can least afford.
          # Top-level metadata files are named individually rather than by a
          # pattern. A rule like "any dotfile" would swallow .dockerignore,
          # which decides what goes into the image and is the opposite of
          # irrelevant. Verified 2026-08-14 by listing /app inside the running
          # image: none of these are present.
          IRRELEVANT='^(terraform|ansible|charts|docs|prompt|tests|scripts|\.github|\.claude)/|^[^/]*\.md$|^(\.gitignore|\.gitattributes|\.editorconfig|LICENSE)$'
          if echo "$FILES" | grep -Eqv "$IRRELEVANT"; then
            DEPLOYABLE=true
          else
            DEPLOYABLE=false
            echo "every changed path is excluded from the image and the box -> nothing to deploy"
          fi

          echo "redis=$RD"                >> "$GITHUB_OUTPUT"
          echo "mobile_only=$MOBILE_ONLY" >> "$GITHUB_OUTPUT"
          echo "dial=$DIAL"               >> "$GITHUB_OUTPUT"
          echo "api=$API"                 >> "$GITHUB_OUTPUT"
          echo "frontend=$FE"             >> "$GITHUB_OUTPUT"
          echo "deployable=$DEPLOYABLE"   >> "$GITHUB_OUTPUT"
          echo "mobile_only=$MOBILE_ONLY dial=$DIAL api=$API frontend=$FE deployable=$DEPLOYABLE"

  # The dial's only gate. Nothing in ci.yml reads frontend/public/mobile:
  # tsc looks at src, vitest looks at src, and vite copies public/ verbatim.
  # So a syntax error in this file has always been shippable. It is not now.
  #
  # Gated on `dial`, not `mobile_only`: this ran only when the dial changed by
  # itself, so a commit carrying a dial edit alongside anything else skipped it.
  mobile-gate:
    name: Dial syntax gate
    runs-on: ubuntu-latest
    needs: [scope]
    if: needs.scope.outputs.dial == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Parse every inline script and check the build stamp
        run: node scripts/ci/check-dial.mjs

  # CI does NOT run here. It ran on the pull request, and as of 2026-07-27 main
  # requires those 8 checks with `strict` on -- a branch must be up to date with
  # main to merge, so the tree CI validated IS the tree that lands. Re-running
  # the identical suite cost 5-13 minutes on every merge and could not reach a
  # different verdict.
  #
  # This is a pair, not two independent settings. If branch protection is ever
  # removed, main has no gate at all: restore it with
  #   bash scripts/rollback-branch-protection.sh restore
  # A backup of the rule lives at ~/.insighta-env-backup/branch-protection-main-20260727.json.

  deploy-edge-functions:
    name: Deploy Edge Functions
    needs: [scope]
    # The ref guard matters for workflow_dispatch, which can be started from any
    # branch; the push trigger is already main-only.
    #
    # mobile_only stays here. It was removed from build-and-push because the dial
    # is inside the frontend image and that job is the only thing that ships it.
    # Edge functions are a different artifact that a dial edit cannot affect, so
    # skipping them is narrowing, not a missed deploy.
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.mobile_only != 'true' && needs.scope.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 'latest' resolves via unauthenticated GitHub API and rate-limits
          # on shared runners (2 consecutive EF-deploy failures, 2026-07-14).
          version: 2.109.1

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in local-cards youtube-sync youtube-auth fetch-url-metadata; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" \
              --project-ref rckkhhjanqgaopynhfgd \
              --no-verify-jwt
          done

  # No mobile_only guard here, and that is the whole repair. It skipped this job
  # because `fast-mobile` shipped the dial by rsync instead; that job addressed
  # the host released on 2026-08-19 and was removed with it. The guard outlived
  # its destination, so a dial-only commit ran the syntax gate, skipped every
  # build and deploy job, and reported green having shipped nothing. Measured
  # 2026-08-19: main carried build 99 since 2026-08-13 and production served 97.
  #
  # The per-image conditions below already do the narrowing this guard was
  # standing in for: a dial-only commit sets frontend=true, api=false,
  # redis=false, so it builds one image and not three.
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [scope]
    if: needs.scope.outputs.deployable == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The cluster pulls from ECR with an instance profile, so nothing has to
      # hold a registry credential. GHCR keeps receiving the same images for
      # the compose host, which is unchanged.
      #
      # The registry host is derived at runtime rather than written down: it
      # contains the AWS account id and this repository is public.
      - name: Log in to ECR
        id: ecr
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          REG="${ACCT}.dkr.ecr.us-west-2.amazonaws.com"
          aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin "$REG"
          echo "registry=$REG" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ACCT"
          echo "::add-mask::$REG"

      # Only the image whose source actually moved. A backend-only commit used
      # to rebuild the frontend image and vice versa; the other side's :latest
      # is already correct, so the rebuild was pure wall-clock.
      - name: Build & push API image
        if: needs.scope.outputs.api == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/insighta-api:latest
            ${{ steps.ecr.outputs.registry }}/insighta-api:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        if: needs.scope.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/insighta-frontend:latest
            ${{ steps.ecr.outputs.registry }}/insighta-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_CHATBOT_PROVIDER=qwen-lora
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This image existed in no registry until 2026-08-14: deploy.yml pushed
      # api and frontend, and the box built redis itself through compose. A
      # cluster cannot build, so a cutover had no redis to pull.
      - name: Build & push Redis image
        if: needs.scope.outputs.redis == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker/redis
          push: true
          tags: |
            ghcr.io/jk42jj/insighta-redis:latest
            ghcr.io/jk42jj/insighta-redis:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/insighta-redis:latest
            ${{ steps.ecr.outputs.registry }}/insighta-redis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The 2-minute path. Copies the committed dial files straight into the running
  # nginx root: no npm install, no vite build, no image, no container restart.
  # There is no drift risk because it only ever copies what is in git -- the next
  # full deploy rebuilds the image from those same files.
  migrate:
    name: Database Schema Sync
    runs-on: ubuntu-latest
    needs: [scope]
    # mobile_only stays here, and deliberately. This runs `prisma db push`
    # against the production database. A dial edit cannot change the schema, so
    # running it would be a write to production with no reason to be there.
    if: needs.scope.outputs.mobile_only != 'true' && needs.scope.outputs.deployable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Sync database schema
        run: |
          set +e
          npx prisma db push --skip-generate 2>&1 | tee /tmp/prisma-push.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            if grep -q "must be owner of table" /tmp/prisma-push.log; then
              echo "::warning::Prisma db push failed on auth-owned table — running table verification"
            else
              exit $EXIT_CODE
            fi
          fi
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Install PostgreSQL client (for custom SQL runner)
        # PGDG apt repo setup — postgresql-client-17 is not in Ubuntu 24.04
        # default repos. Block mirrored from .github/workflows/db-integrity-check.yml
        # and backup.yml which have been running this pattern on green daily.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Apply custom SQL migrations (raw DDL fallback)
        run: bash scripts/apply-custom-sql.sh
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SKIP_SQL_FILES: ${{ vars.SKIP_SQL_FILES || '' }}
      - name: Verify all tables exist
        run: node scripts/verify-db-tables.js
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  publish-tags:
    name: Point the chart at this commit
    needs: [scope, build-and-push]
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # The cluster learns which image to run by reading this repository, so the
      # tag has to arrive here rather than being pushed at the cluster. ArgoCD is
      # not reachable from a runner on purpose -- it holds cluster-admin and has
      # no public address -- so a write-back to git is the path that exists.
      - name: Write the commit sha into the prod values
        run: |
          set -euo pipefail
          F=charts/insighta/environments/prod.yaml
          SHA=${{ github.sha }}

          # Only the images this run actually built. build-and-push is
          # selective -- each image has its own `if` on scope.outputs -- while
          # this loop used to write all three tags unconditionally. So a commit
          # touching src/ produced one api image and a chart claiming all three
          # were at that sha.
          #
          # Measured 2026-08-20 after #1525, which touched src/ and tests/:
          #
          #   insighta-api:ee911588        present
          #   insighta-frontend:ee911588   ABSENT
          #   insighta-redis:ee911588      ABSENT
          #
          # A sync against that chart gives ImagePullBackOff on three frontend
          # pods and redis. Nothing reports it until someone syncs, and then it
          # is an outage caused by a deploy that reported success.
          #
          # A tag left alone keeps naming the last image that was actually
          # built for it, which is exactly what should still be running.
          wrote=0
          for pair in "apiTag:${{ needs.scope.outputs.api }}" \
                      "frontendTag:${{ needs.scope.outputs.frontend }}" \
                      "redisTag:${{ needs.scope.outputs.redis }}"; do
            key=${pair%%:*}
            built=${pair#*:}
            if [ "$built" != "true" ]; then
              echo "$key left at $(grep -E "^  $key:" "$F" | awk '{print $2}') -- no image was built for it this run"
              continue
            fi
            sed -i -E "s|^  $key:.*|  $key: $SHA|" "$F"
            wrote=$((wrote + 1))
          done
          [ "$wrote" -gt 0 ] || { echo "no image was built this run; nothing to pin"; }
          grep -E '^  (api|frontend|redis)Tag:' "$F"

      # This pushed straight to main until 2026-08-19 and was refused on its
      # first execution (run 32218303510):
      #
      #   remote: error: GH006: Protected branch update failed for refs/heads/main.
      #   remote: - 8 of 8 required status checks are expected.
      #
      # main requires 8 checks with strict on, and a commit pushed by CI carries
      # none, so it can never satisfy them. That is a property of the mechanism,
      # not of the configuration -- there is no setting on this job that makes a
      # direct push work.
      #
      # What it does instead: push a branch, which protection does not cover, and
      # open a pull request from it. Merging that PR is one click, and it is the
      # same change this job used to attempt.
      #
      # Why the merge is not automatic. GitHub does not trigger workflows from
      # events created with GITHUB_TOKEN, so ci.yml would never run on a PR this
      # job opens, the 8 required checks would never report, and auto-merge would
      # wait forever. Closing that gap needs a token that is not GITHUB_TOKEN --
      # a credential decision, recorded in docs/ops/k8s-migration-issue-checklist.md
      # under A-5 rather than made here.
      #
      # enforce_admins is false on this branch, so an admin can merge the PR even
      # with the checks unreported. That is the intended path until A-5 is settled.
      - name: Open a pull request with the tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F=charts/insighta/environments/prod.yaml
          SHA=${{ github.sha }}

          # A re-run, or a deploy whose images were already pinned, has nothing
          # to propose. Not an error.
          if git diff --quiet -- "$F"; then
            echo "tags already at $SHA"
            echo "### Image tags already at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="images/${SHA:0:12}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$F"
          git commit -m "chore(images): point prod at $SHA"

          # Branch names outside main are not protected, so this succeeds where
          # the push to main did not.
          git push --force-with-lease origin "$BRANCH"

          # An existing PR for this sha means a re-run; reuse it rather than
          # failing on the duplicate.
          URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --base main --head "$BRANCH" \
              --title "chore(images): point prod at ${SHA:0:12}" \
              --body "Opened by deploy.yml after pushing these images to ECR.

          Merging this is what tells the cluster which images to run: ArgoCD reads
          \`charts/insighta/environments/prod.yaml\` from this repository, and until this
          lands it still names the previous ones.

          Production syncs manually, so merging does not deploy on its own.

          Not merged automatically: GitHub does not run workflows on events created
          with GITHUB_TOKEN, so the required checks will not report here. See A-5 in
          \`docs/ops/k8s-migration-issue-checklist.md\`.")
          fi

          echo "::notice title=Image tags need one merge::$URL"
          {
            echo "### Image tags are waiting on a merge"
            echo
            echo "\`$SHA\`"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # `fast-mobile` and `deploy` lived here until 2026-08-19. Both ended in an SSH
  # session to secrets.EC2_HOST, copying files onto the host that served the site
  # before the cluster cutover on 2026-08-14. That instance was released on
  # 2026-08-19, so both jobs addressed a machine that no longer exists.
  #
  # They were not failing yet only because every merge since had touched docs or
  # terraform, which `scope` marks non-deployable. The first real code change
  # would have been the first failure.
  #
  # Nothing replaces them here. Images still reach ECR from `build-and-push`, and
  # what carries them into the cluster is ArgoCD reading this repository. The
  # image tag it reads is set in charts/insighta/environments/prod.yaml.
