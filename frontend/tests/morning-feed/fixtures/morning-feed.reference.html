      var deck = deckOf(S.c), res = Object.assign({}, S.res);

      // 저장 지점: 실제 구현은 여기서 판정 1행 저장 (keep → useful, skip → skip)
      window.__mfJudgments = (window.__mfJudgments || []).concat([{ index: deck[S.i], verdict: kind === 'keep' ? 'useful' : 'skip' }]);
      set({ res: res, i: S.i + 1, anim: false, dx: 0, dy: 420, pulse: false });
      setTimeout(function () { set({ anim: true, dy: 0, leaving: false }); }, 30);
      showToast(kind === 'keep' ? '담았어요' : '넘겼어요', true);
    }, 260);
  }
  function pickCell(k) {
    if (S.picking >= 0) return;
    if (deckOf(k).length === 0) return; // 카드 없는 칸은 흐리게 '0', 눌러도 이동 없음
    set({ picking: k });
    setTimeout(function () {
      clearTimeout(tt);
      set({ picker: false, c: k, i: 0, anim: false, dx: 0, dy: 520, play: false, toast: null });
      setTimeout(function () {
        set({ anim: true, dy: 0, picking: -1 });
        showToast(GRID[k].short + ' · ' + deckOf(k).length + '개', false);
      }, 60);
    }, 260);
  }

  // ── 그리드 9칸 (한 번 만들고 스타일만 갱신) ──
  var cellEls = GRID.map(function (g, k) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('data-testid', 'mf-cell-' + k);
    var art = document.createElement('span');
    var mosaic = document.createElement('span');
    mosaic.style.cssText = 'position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px';
    var tiles = [0, 1, 2, 3].map(function () { var t = document.createElement('span'); mosaic.appendChild(t); return t; });
    var th = document.createElement('span');
    th.style.cssText = 'position: absolute; left: 9px; right: 8px; bottom: 8px; font-size: 13px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF; white-space: pre-line';
    if (g.dom === -1) art.appendChild(mosaic); else art.appendChild(th);
    var lab = document.createElement('span'), meta = document.createElement('span');
    b.appendChild(art); b.appendChild(lab); b.appendChild(meta);
    b.addEventListener('click', function () { pickCell(k); });
    $('grid').appendChild(b);
    return { b: b, art: art, tiles: tiles, th: th, lab: lab, meta: meta };
  });

  var dotsFor = -1, dotEls = [];
  function buildDots(n) {
    $('dots').innerHTML = ''; dotEls = [];
    for (var k = 0; k < n; k++) { var d = document.createElement('div'); $('dots').appendChild(d); dotEls.push(d); }
  }

  function render() {
    var s = S, deck = deckOf(s.c), n = deck.length, done = s.i >= n;
    var card = CARDS[deck[Math.min(s.i, n - 1)]] || CARDS[0]; // 빈 덱 방어
    var ease = s.anim && !s.drag ? (s.demo ? 'transform 0.7s cubic-bezier(0.45,0,0.2,1)' : 'transform 0.34s cubic-bezier(0.32,0.72,0,1)') : 'none';
    var rot = s.dx > 0 ? (s.dx / 30).toFixed(2) : '0';
    var ko = Math.max(0, Math.min(1, s.dx / 90));
    var fresh = /일 전/.test(card.ago) && parseInt(card.ago, 10) <= 7;

    $('chip').style.cssText = 'height: 36px; padding: 0 14px 0 12px; border-radius: 999px; border: none; background: #1D1D23; color: #F4F2EE; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.2s cubic-bezier(.34,1.4,.64,1); transform: scale(' + (s.picker ? 0.94 : 1) + ')';
    $('chipLabel').textContent = GRID[s.c].short;
    $('tray').style.cssText = 'height: 36px; padding: 0 14px; border-radius: 999px; background: #1D1D23; display: flex; align-items: center; gap: 6px; transition: transform 0.2s cubic-bezier(.34,1.4,.64,1); transform: scale(' + (s.pulse ? 1.2 : 1) + ')';
    $('trayCount').textContent = String(Object.keys(s.res).filter(function (k) { return s.res[k] === 'keep'; }).length);

    $('deckWrap').style.display = done ? 'none' : 'block';
    $('card').style.cssText = 'position: absolute; top: 60px; left: 0; right: 0; height: 640px; background: #0E0E11; touch-action: none; cursor: grab; transform: translate(' + s.dx + 'px, ' + s.dy + 'px) rotate(' + rot + 'deg); transform-origin: 50% 100%; transition: ' + ease;
    $('player').style.background = card.bg;
    $('thumb').textContent = card.thumb;
    $('progress').style.cssText = 'position: absolute; left: 0; bottom: 0; height: 3px; background: #FFFFFF; transition: width 0.3s; width: ' + (s.play ? '42%' : '18%') + '; opacity: 0.85';
    $('fresh').style.cssText = 'height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; font-weight: 700; ' + (fresh ? 'background: #E0703F; color: #1A1916' : 'background: #1D1D23; color: #D9D5CC');
    $('fresh').textContent = card.ago;
    $('dur').textContent = card.dur;
    $('title').textContent = card.title;
    $('avatar').style.background = card.bg; $('avatar').textContent = card.ini;
    $('ch').textContent = card.ch; $('chMeta').textContent = card.chMeta;
    $('fit').style.cssText = 'border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; transition: background 0.15s, box-shadow 0.15s; background: ' + (ko > 0.3 ? '#2A2117' : '#18181D') + '; box-shadow: ' + (ko > 0.3 ? 'inset 0 0 0 1.5px #E0703F' : 'none');
    $('fitLabel').textContent = card.cell;
    $('why').textContent = card.why;
    $('keepMark').style.cssText = 'position: absolute; top: 50%; left: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: #E0703F; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(224,112,63,0.5); pointer-events: none; opacity: ' + ko + '; transform: scale(' + (0.5 + 0.5 * ko).toFixed(2) + ')';

    var showToastNow = !!s.toast && !done;
    $('toast').style.display = showToastNow ? 'flex' : 'none';
    $('toastText').textContent = s.toast || '';
    $('onboard').style.cssText = 'align-self: center; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(224,112,63,0.14); color: #F0A07A; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: opacity 0.4s ease, transform 0.4s ease; opacity: ' + (s.onboard && !done ? 1 : 0) + '; transform: translateY(' + (s.onboard ? 0 : 6) + 'px)';

    if (dotsFor !== s.c || dotEls.length !== n) { buildDots(n); dotsFor = s.c; }
    deck.forEach(function (key, k) {
      var cur = k === s.i && !done, rk = s.res[key];
      var bg = cur ? '#FFFFFF' : (rk ? (rk === 'keep' ? '#E0703F' : 'rgba(255,255,255,0.38)') : 'rgba(255,255,255,0.18)');
      dotEls[k].style.cssText = 'width: ' + (cur ? '18px' : '6px') + '; height: 6px; border-radius: 3px; background: ' + bg + '; transition: width 0.35s cubic-bezier(.34,1.4,.64,1), background 0.25s ease';
    });

    $('done').style.display = done ? 'flex' : 'none';
    var keptKeys = deck.filter(function (key) { return s.res[key] === 'keep'; });
    $('doneSub').textContent = GRID[s.c].short + ' · ' + n + '개 중';
    $('doneCount').textContent = String(keptKeys.length);
    $('keptList').innerHTML = '';
    keptKeys.forEach(function (key) {
      var c = CARDS[key];
      var row = document.createElement('div'); row.style.cssText = 'display: flex; gap: 12px; align-items: center';
      var im = document.createElement('div'); im.style.cssText = 'width: 104px; height: 58px; border-radius: 10px; background: ' + c.bg + '; flex: none';
      var tx = document.createElement('div'); tx.style.cssText = 'display: flex; flex-direction: column; gap: 3px; min-width: 0';
      var t1 = document.createElement('span'); t1.style.cssText = 'font-size: 14px; line-height: 1.4; font-weight: 700'; t1.textContent = c.title;
      var t2 = document.createElement('span'); t2.style.cssText = 'font-size: 12px; color: #F5D48A'; t2.textContent = c.cell;
      tx.appendChild(t1); tx.appendChild(t2); row.appendChild(im); row.appendChild(tx); $('keptList').appendChild(row);
    });

    $('scrim').style.cssText = 'position: absolute; inset: 0; z-index: 20; background: rgba(8,8,10,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity 0.28s ease; opacity: ' + (s.picker ? 1 : 0) + '; pointer-events: ' + (s.picker ? 'auto' : 'none');
    $('sheet').style.cssText = "position: absolute; left: 8px; right: 8px; top: 56px; z-index: 21; padding: 8px 14px 18px; border-radius: 38px; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: rgba(37,37,40,0.78); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 40px 80px rgba(0,0,0,0.55), inset 0 0.5px 0 rgba(255,255,255,0.18); display: flex; flex-direction: column; gap: 16px; transform-origin: 20% 0%; transition: transform 0.42s cubic-bezier(.34,1.25,.64,1), opacity 0.22s ease; opacity: " + (s.picker ? 1 : 0) + '; transform: ' + (s.picker ? 'scale(1) translateY(0)' : 'scale(0.6) translateY(-30px)') + '; pointer-events: ' + (s.picker ? 'auto' : 'none');
    $('leftAll').textContent = '새 영상 ' + CARDS.filter(function (x, k) { return !s.res[k]; }).length;

    GRID.forEach(function (g, k) {
      var el = cellEls[k], keys = deckOf(k);
      var unseen = keys.filter(function (key) { return !s.res[key]; });
      var left = unseen.length, center = g.dom === -1, sel = k === s.c, picking = k === s.picking, empty = left === 0;
      var delay = (Math.abs(Math.floor(k / 3) - 1) + Math.abs((k % 3) - 1)) * 45;
      var rep = CARDS[(unseen.length ? unseen : keys)[0]] || null;
      el.b.setAttribute('aria-label', g.label + ', ' + (empty ? '다 봤어요' : left + '개 남음'));
      el.b.style.cssText = 'border: none; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 0; text-align: left; font-family: inherit; min-width: 0; '
        + 'transition: transform 0.42s cubic-bezier(.34,1.3,.64,1) ' + (s.picker ? delay : 0) + 'ms, opacity 0.26s ease ' + (s.picker ? delay : 0) + 'ms; '
        + 'opacity: ' + (s.picker ? (empty ? 0.4 : 1) : 0) + '; transform: scale(' + (picking ? 1.06 : (s.picker ? 1 : 0.8)) + ')';
      el.art.style.cssText = 'position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: ' + (center || !rep ? '#1C1C1E' : rep.bg) + '; '
        + 'box-shadow: ' + (sel ? '0 0 0 2px #0E0E11, 0 0 0 4px #FFFFFF' : '0 6px 16px -6px rgba(0,0,0,0.6)');
      var mk = (unseen.length >= 4 ? unseen : keys).slice(0, 4);
      el.tiles.forEach(function (t, j) { t.style.cssText = 'display: block; background: ' + (mk[j] != null ? CARDS[mk[j]].bg : 'transparent'); });
      el.th.textContent = rep ? rep.thumb : '';
      el.lab.style.cssText = 'margin-top: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #FFFFFF';
      el.lab.textContent = g.short;
      el.meta.style.cssText = 'margin-top: 1px; font-size: 12px; color: rgba(235,235,245,0.6)';
      el.meta.textContent = String(left);
    });
  }

  // ── 입력 ──
  var cardEl = $('card');
  cardEl.addEventListener('pointerdown', function (e) {
    var done = S.i >= deckOf(S.c).length;
    if (S.leaving || done || S.picker) return;
    if (e.clientX - $('app').getBoundingClientRect().left < 24) return; // iOS 가장자리 뒤로 가기와 충돌 방지 (M4)
    endOnboard();
    cardEl.setPointerCapture(e.pointerId); sx = e.clientX; sy = e.clientY; moved = 0; vx = 0; vy = 0; lt = e.timeStamp; lx = e.clientX; ly = e.clientY; set({ drag: true });
  });
  cardEl.addEventListener('pointermove', function (e) {
    if (!S.drag) return;
    var dt = Math.max(1, e.timeStamp - lt);
    vx = 0.8 * ((e.clientX - lx) / dt) + 0.2 * vx; vy = 0.8 * ((e.clientY - ly) / dt) + 0.2 * vy;
    lt = e.timeStamp; lx = e.clientX; ly = e.clientY;
    var x = e.clientX - sx, y = e.clientY - sy;
    moved = Math.max(Math.abs(x), Math.abs(y));
    if (Math.abs(x) > Math.abs(y)) set({ dx: Math.max(0, x), dy: 0 }); else set({ dx: 0, dy: Math.min(0, y) });
  });
  function up() {
    if (!S.drag) return;
    // 거리 또는 빠른 튕김(0.5px/ms 이상 + 30px 이상)으로 확정 — 네이티브 앱과 같은 감각
    if (S.dx > 100 || (vx > 0.5 && S.dx > 30)) commit('keep');
    else if (S.dy < -90 || (vy < -0.5 && S.dy < -30)) commit('skip');
    else set({ drag: false, anim: true, dx: 0, dy: 0 });
  }
  cardEl.addEventListener('pointerup', up); cardEl.addEventListener('pointercancel', up);
  $('player').addEventListener('click', function () { if (moved > 6) return; set({ play: !S.play }); });
  $('undo').addEventListener('click', function () {
    if (!S.undoable || S.i === 0 || lastKey == null) return;
    clearTimeout(tt);
    var res = Object.assign({}, S.res); delete res[lastKey]; lastKey = null;
    window.__mfJudgments = (window.__mfJudgments || []).slice(0, -1);
    set({ res: res, i: S.i - 1, toast: null, anim: false, dy: -300 });
    setTimeout(function () { set({ anim: true, dy: 0 }); }, 30);
  });
  $('chip').addEventListener('click', function () { set({ picker: true }); });
  $('doneOther').addEventListener('click', function () { set({ picker: true }); });
  $('scrim').addEventListener('click', function () { set({ picker: false }); });
  $('sheetClose').addEventListener('click', function () { set({ picker: false }); });

  // ── 테스트용 상태 고정 ──
  var st = Q.get('state');
  if (st === 'keep') { S.onboard = false; S.dx = 118; S.anim = false; }
  if (st === 'picker') { S.onboard = false; S.picker = true; }
  if (st === 'toast') { S.onboard = false; S.res = { 0: 'keep' }; S.i = 1; S.toast = '담았어요'; S.undoable = true; }
  if (st === 'done') {
    S.onboard = false;
    deckOf(S.c).forEach(function (key, j) { S.res[key] = (j % 3 === 0) ? 'keep' : 'skip'; });
    S.i = deckOf(S.c).length;
  }
  render();

  // ── 최초 온보딩: 오른쪽 담기 동작을 한 번 시연 ──
  if (S.onboard) {
    var at = function (ms, fn) { obt.push(setTimeout(fn, ms)); };
    at(900, function () { set({ demo: true, anim: true, dx: 84 }); });
    at(1900, function () { set({ dx: 0 }); });
    at(2700, function () { set({ demo: false }); });
    at(4200, function () { set({ onboard: false }); });
  }
})();
</script>
</body>
</html>
