---
# The host is addressed by its ~/.ssh/config alias, never by IP.
#
# This repository is public: an elastic IP committed here is a permanent
# disclosure. The alias resolves locally, so the address stays on the
# operator's machine.
#
# Reaching the box at all requires the security group to allow the current
# egress IP. Run this before any playbook:
#
#   bash scripts/ssh-connect.sh --update-sg
#
# See ansible/README.md.
all:
  children:
    prod:
      hosts:
        insighta-ec2:
          ansible_user: ubuntu
